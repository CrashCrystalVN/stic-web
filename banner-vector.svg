<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 640" width="100%" height="100%">
  <defs>
    <style>
      /* CSS Adaptive Theme Variables */
      :root {
        --banner-bg-base: #f8fafc;
        --banner-bg-gradient: url(#lightAtmosphere);
        --banner-aura: #0284c7;
        --banner-aura-opacity: 0.12;
        --banner-grid-color: #0f172a;
        --banner-grid-opacity: 0.05;
        --banner-badge-bg: rgba(15, 23, 42, 0.05);
        --banner-badge-border: rgba(15, 23, 42, 0.12);
        --banner-badge-text: #475569;
        --banner-text-primary: url(#sticGradLight);
        --banner-divider: url(#dividerLight);
        --banner-title: #0f172a;
        --banner-subtitle: #64748b;
        --banner-footer: #94a3b8;
        --banner-dot: #0284c7;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --banner-bg-base: #020408;
          --banner-bg-gradient: url(#darkAtmosphere);
          --banner-aura: #38bdf8;
          --banner-aura-opacity: 0.14;
          --banner-grid-color: #ffffff;
          --banner-grid-opacity: 0.04;
          --banner-badge-bg: rgba(255, 255, 255, 0.05);
          --banner-badge-border: rgba(255, 255, 255, 0.12);
          --banner-badge-text: #94a3b8;
          --banner-text-primary: url(#sticGradDark);
          --banner-divider: url(#dividerDark);
          --banner-title: #f1f5f9;
          --banner-subtitle: #64748b;
          --banner-footer: #475569;
          --banner-dot: #38bdf8;
        }
      }

      .banner-bg-rect { fill: var(--banner-bg-base); }
      .banner-atmosphere-rect { fill: var(--banner-bg-gradient); }
      .banner-aura-circle { fill: var(--banner-aura); opacity: var(--banner-aura-opacity); }
      .banner-grid-line { stroke: var(--banner-grid-color); opacity: var(--banner-grid-opacity); }
      .banner-badge-rect { fill: var(--banner-badge-bg); stroke: var(--banner-badge-border); }
      .banner-badge-text { fill: var(--banner-badge-text); }
      .banner-stic-text { fill: var(--banner-text-primary); }
      .banner-divider-line { stroke: var(--banner-divider); }
      .banner-title-text { fill: var(--banner-title); }
      .banner-subtitle-text { fill: var(--banner-subtitle); }
      .banner-footer-text { fill: var(--banner-footer); }
      .banner-dot-accent { fill: var(--banner-dot); }
    </style>

    <!-- Dark Atmosphere -->
    <radialGradient id="darkAtmosphere" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#050811" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#020408" stop-opacity="1"/>
    </radialGradient>

    <!-- Light Atmosphere -->
    <radialGradient id="lightAtmosphere" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#e0f2fe" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#f1f5f9" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#f8fafc" stop-opacity="1"/>
    </radialGradient>

    <!-- STIC Text Gradient: Dark Mode (Pure Crisp White to Sky Light) -->
    <linearGradient id="sticGradDark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#e0f2fe"/>
      <stop offset="75%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#7dd3fc"/>
    </linearGradient>

    <!-- STIC Text Gradient: Light Mode (Deep Obsidian Navy to Vibrant Tech Blue) -->
    <linearGradient id="sticGradLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="45%" stop-color="#0369a1"/>
      <stop offset="75%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>

    <!-- Dividers -->
    <linearGradient id="dividerDark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="dividerLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0"/>
      <stop offset="50%" stop-color="#0284c7" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </linearGradient>

    <filter id="softAuraBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
  </defs>

  <!-- Adaptive Canvas Background -->
  <rect width="1600" height="640" class="banner-bg-rect"/>
  <rect width="1600" height="640" class="banner-atmosphere-rect"/>

  <!-- Soft Central Aura -->
  <circle cx="800" cy="300" r="320" class="banner-aura-circle" filter="url(#softAuraBlur)"/>

  <!-- Subtle Minimalist Grid Accent -->
  <g stroke-width="1">
    <line x1="800" y1="0" x2="800" y2="640" stroke-dasharray="4 8" class="banner-grid-line"/>
    <circle cx="800" cy="300" r="240" fill="none" stroke-dasharray="2 6" class="banner-grid-line"/>
    <circle cx="800" cy="300" r="380" fill="none" stroke-dasharray="3 10" class="banner-grid-line"/>
  </g>

  <!-- Top Pill Badge: DANANG TECH HUB -->
  <g transform="translate(800, 160)">
    <rect x="-85" y="-14" width="170" height="28" rx="14" stroke-width="0.8" class="banner-badge-rect"/>
    <circle cx="-56" cy="0" r="2.5" class="banner-dot-accent"/>
    <text x="8" y="4" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" letter-spacing="2.5" text-anchor="middle" class="banner-badge-text">
      DANANG TECH HUB
    </text>
  </g>

  <!-- Main Wordmark: STIC -->
  <g transform="translate(800, 310)">
    <text x="0" y="0" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="116" font-weight="800" letter-spacing="18" text-anchor="middle" class="banner-stic-text">
      STIC
    </text>
  </g>

  <!-- Single Elegant Minimalist Divider -->
  <line x1="620" y1="365" x2="980" y2="365" stroke-width="1" class="banner-divider-line"/>

  <!-- Club Subtitle -->
  <text x="800" y="415" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="15" font-weight="600" letter-spacing="7" text-anchor="middle" class="banner-title-text">
    SCIENCE &amp; TECHNOLOGY INNOVATION CLUB
  </text>

  <text x="800" y="450" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" letter-spacing="2" text-anchor="middle" class="banner-subtitle-text">
    CLB Khoa Học Kỹ Thuật • THPT Đà Nẵng
  </text>

  <!-- Bottom Coordinates / Minimal Footer -->
  <g transform="translate(800, 545)">
    <text x="0" y="0" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="500" letter-spacing="3" text-anchor="middle" class="banner-footer-text">
      [ 16.0544° N, 108.2022° E ] — GEN 1.0
    </text>
  </g>
</svg>