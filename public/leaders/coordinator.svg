<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f051c"/>
      <stop offset="45%" stop-color="#1b0a30"/>
      <stop offset="100%" stop-color="#08020f"/>
    </linearGradient>
    <linearGradient id="purpleGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <radialGradient id="aurora" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.38"/>
      <stop offset="45%" stop-color="#7c3aed" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(192, 132, 252, 0.08)" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="800" fill="url(#bg)"/>
  <rect width="600" height="800" fill="url(#aurora)"/>
  <rect width="600" height="800" fill="url(#grid)"/>

  <!-- Cyber Viewfinder Corners -->
  <g stroke="#c084fc" stroke-width="2" opacity="0.7">
    <path d="M 25 45 L 25 25 L 45 25" fill="none"/>
    <path d="M 575 45 L 575 25 L 555 25" fill="none"/>
    <path d="M 25 755 L 25 775 L 45 775" fill="none"/>
    <path d="M 575 755 L 575 775 L 555 775" fill="none"/>
  </g>

  <!-- Circuit connection lines across 3:4 canvas -->
  <g stroke="rgba(192, 132, 252, 0.25)" stroke-width="1" fill="none">
    <path d="M 50 120 L 140 120 L 180 160"/>
    <circle cx="50" cy="120" r="3" fill="#c084fc"/>
    <circle cx="180" cy="160" r="2" fill="#c084fc"/>
    <path d="M 550 120 L 460 120 L 420 160"/>
    <circle cx="550" cy="120" r="3" fill="#c084fc"/>
    <circle cx="420" cy="160" r="2" fill="#c084fc"/>
    <path d="M 100 680 L 200 680 L 230 650"/>
    <circle cx="100" cy="680" r="2.5" fill="#c084fc"/>
    <path d="M 500 680 L 400 680 L 370 650"/>
    <circle cx="500" cy="680" r="2.5" fill="#c084fc"/>
  </g>

  <!-- Central Avatar Orb / Hologram (Expanded for 3:4 portrait) -->
  <g transform="translate(300, 370)">
    <!-- Outer concentric rings -->
    <circle r="160" fill="none" stroke="url(#purpleGlow)" stroke-width="1.5" stroke-dasharray="6 8" opacity="0.5"/>
    <circle r="140" fill="none" stroke="#c084fc" stroke-width="1" stroke-dasharray="3 12" opacity="0.7"/>
    <circle r="125" fill="#150a24" stroke="#c084fc" stroke-width="2.5" opacity="0.95" filter="url(#glow)"/>
    
    <!-- Silhouette Portrait with Purple Glow -->
    <circle cx="0" cy="-30" r="50" fill="url(#purpleGlow)"/>
    <path d="M -80 90 C -80 30, 80 30, 80 90 Z" fill="url(#purpleGlow)" opacity="0.95"/>
    
    <!-- Neon Hologram Visor / Glasses -->
    <path d="M -32 -34 L 32 -34 L 24 -20 L -24 -20 Z" fill="#ffffff" filter="url(#glow)"/>
    <line x1="-42" y1="-27" x2="42" y2="-27" stroke="#c084fc" stroke-width="2.5"/>

    <!-- Reticle Crosshairs -->
    <line x1="-180" y1="0" x2="-150" y2="0" stroke="#c084fc" stroke-width="2"/>
    <line x1="150" y1="0" x2="180" y2="0" stroke="#c084fc" stroke-width="2"/>
    <line x1="0" y1="-180" x2="0" y2="-150" stroke="#c084fc" stroke-width="2"/>
    <line x1="0" y1="150" x2="0" y2="180" stroke="#c084fc" stroke-width="2"/>
  </g>

  <!-- Digital Audio / Frequency Equalizer Bars -->
  <g transform="translate(300, 590)" fill="#c084fc" opacity="0.75">
    <rect x="-80" y="-14" width="4" height="28" rx="2"/>
    <rect x="-65" y="-20" width="4" height="40" rx="2"/>
    <rect x="-50" y="-32" width="4" height="64" rx="2"/>
    <rect x="-35" y="-18" width="4" height="36" rx="2"/>
    <rect x="-20" y="-28" width="4" height="56" rx="2"/>
    <rect x="-5" y="-35" width="4" height="70" rx="2"/>
    <rect x="10" y="-24" width="4" height="48" rx="2"/>
    <rect x="25" y="-16" width="4" height="32" rx="2"/>
    <rect x="40" y="-30" width="4" height="60" rx="2"/>
    <rect x="55" y="-15" width="4" height="30" rx="2"/>
    <rect x="70" y="-10" width="4" height="20" rx="2"/>
  </g>

  <!-- Watermark / Footer HUD -->
  <text x="300" y="690" text-anchor="middle" fill="#c084fc" font-family="'Plus Jakarta Sans', monospace, sans-serif" font-size="12" font-weight="bold" letter-spacing="4" opacity="0.9">STIC // COORDINATOR</text>
  <text x="300" y="715" text-anchor="middle" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" letter-spacing="2" opacity="0.7">COMMUNITY &amp; OUTREACH</text>
</svg>